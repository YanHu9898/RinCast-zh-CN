plugins {
    id "com.android.application"
}

def repoRoot = rootProject.file("..").canonicalFile
def appVersion = new File(repoRoot, "VERSION").text.trim()
def (versionMajor, versionMinor, versionPatch) = appVersion.tokenize(".")*.toInteger()

// Keeps the build machine's paths out of the native libraries.
def filePrefixMap = "-ffile-prefix-map=${repoRoot.path.replace('\\', '/')}=.".toString()

// Release signing comes from the environment; see docs/BUILDING.md.
def releaseSigningEnv = ["RINCAST_KEYSTORE", "RINCAST_KEYSTORE_PASSWORD", "RINCAST_KEY_ALIAS", "RINCAST_KEY_PASSWORD"]
def missingSigningEnv = releaseSigningEnv.findAll { !System.getenv(it) }

android {
    namespace "app.rincast.vr"
    compileSdk 34
    ndkVersion "27.3.13750724"

    defaultConfig {
        // Separate from upstream: a debug-signed translation must not replace the
        // upstream app (their signing certificates are different).
        applicationId "app.rincast.vr.zhcn"
        minSdk 29
        targetSdk 32           // Meta Horizon Store requirement for Quest apps
        versionCode versionMajor * 10000 + versionMinor * 100 + versionPatch
        versionName appVersion
        ndk { abiFilters "arm64-v8a" }
        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=c++_shared", "-DANDROID_PLATFORM=android-29"
                cFlags filePrefixMap
                cppFlags "-std=c++20", filePrefixMap
            }
        }
    }

    signingConfigs {
        release {
            if (missingSigningEnv.isEmpty()) {
                storeFile file(System.getenv("RINCAST_KEYSTORE"))
                storePassword System.getenv("RINCAST_KEYSTORE_PASSWORD")
                keyAlias System.getenv("RINCAST_KEY_ALIAS")
                keyPassword System.getenv("RINCAST_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    sourceSets {
        main.assets.srcDir layout.buildDirectory.dir("generated/notices")
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }

    buildFeatures {
        prefab true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        jniLibs { useLegacyPackaging true }
    }

    lint {
        // Quest apps target API 32 on purpose (Horizon OS), not the Play Store minimum.
        disable "ExpiredTargetSdkVersion"
    }

    androidResources {
        noCompress "rctx", "png", "jpg", "ttf"
    }
}

// The licence texts ship inside the APK, in assets/licenses.
def copyNotices = tasks.register("copyNotices", Copy) {
    from(repoRoot) { include "LICENSE", "THIRD_PARTY_NOTICES.md" }
    into layout.buildDirectory.dir("generated/notices/licenses")
}

def checkReleaseSigning = tasks.register("checkReleaseSigning") {
    doLast {
        if (!missingSigningEnv.isEmpty()) {
            throw new GradleException("Release builds must be signed. Set ${missingSigningEnv.join(', ')} " +
                "(see docs/BUILDING.md), or build a debug APK with assembleDebug.")
        }
    }
}

tasks.matching { it.name == "preBuild" }.configureEach { dependsOn copyNotices }
tasks.matching { it.name == "preReleaseBuild" }.configureEach { dependsOn checkReleaseSigning }

dependencies {
    implementation "org.khronos.openxr:openxr_loader_for_android:1.1.61"
}
